site_name: LlamaBlocks Documentation
site_url: https://omegabird113.github.io/llamamod/
repo_name: omegabird113/llamamod
repo_url: https://github.com/omegabird113/llamamod/
edit_uri: ""
copyright: "© 2026 Omegabird113 — This documentation is available under the CC-BY-SA 4.0 license"

theme:
  name: material
  logo: images/logo.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: green
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference  
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omegabird113/llamamod/
      name: LlamaBlocks GitHub Repository
  generator: false

  analytics:
    provider: google
    property: G-RZXKT1MRC8
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: Yes
          data: 1
          note: Thanks for the feedback!
        - icon: material/thumb-down-outline
          name: No
          data: 0
          note: Thanks for the feedback!

  consent:
    title: Cookie consent
    description: >-
      This site uses Google Analytics to understand how it is being used.
      Accepting helps me improve the documentation.
    cookies:
      analytics:
        name: Google Analytics
        checked: true   
    actions:
      - accept
      - reject
      - manage

docs_dir: documentation/
