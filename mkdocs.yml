theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.ico
  palette:
    - media: "(prefers-color-scheme)"
      primary: green
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.action.edit

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omegabird113/llamamod/
      name: LlamaBlocks GitHub Repository
  generator: true

  analytics:
    provider: google
    property: G-RZXKT1MRC8
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: Yes
          data: 1
          note: Thanks for the feedback!
        - icon: material/thumb-down-outline
          name: No
          data: 0
          note: Thanks for the feedback!

  consent:
    title: Cookie consent
    description: >-
      This site uses Google Analytics to understand how it is being used.
      Accepting helps me improve the documentation.
    cookies:
      analytics:
        name: Google Analytics
        checked: true   
    actions:
      - accept
      - reject
      - manage

docs_dir: documentation/
