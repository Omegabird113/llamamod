name: Documentation Sync
on:
  schedule:
    - cron: '0 0 * * 3,0'
      timezone: "America/New_York"
  workflow_dispatch:
  
jobs:
  documentation-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v6
        with:
          path: mod-repo
      - name: Checkout docs repo
        uses: actions/checkout@v6
        with:
          repository: Omegabird113/LlamaBlocks-Documentation
          path: temp-docs
      - name: Get docs repo commit hash
        id: docs-sha
        run: echo "sha=$(git -C temp-docs rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Get current date
        id: docs-date
        run: echo "date=$(TZ='America/New_York' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Sync docs folder
        run: |
          rm -rf mod-repo/documentation
          mkdir -p mod-repo/documentation
          rsync -a --exclude='.git' --exclude='.gitignore' temp-docs/ mod-repo/documentation/
      - name: Check for changes
        id: check-for-changes
        working-directory: mod-repo
        run: |
          git add documentation/
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Exit if no changes
        if: steps.check-for-changes.outputs.changed == 'false'
        run: |
          echo "No documentation changes found, exiting..."
          exit 0
      - name: Create sync pr
        if: steps.check-for-changes.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          path: mod-repo
          branch: documentation-sync-${{ steps.docs-date.outputs.date }}
          commit-message: "Documentation Sync: (${{ steps.docs-date.outputs.date }})"
          title: "Documentation Sync"
          assignees: "Omegabird113"
          reviewers: "Omegabird113"
          body: |
            Automated documentation sync on ${{ steps.docs-date.outputs.date }} from [LlamaBlocks-Documentation](https://github.com/Omegabird113/LlamaBlocks-Documentation).
            **Documentation repo commit**: `${{ steps.docs-sha.outputs.sha }}`
          labels: "documentation"
      - name: Zip docs
        if: steps.check-for-changes.outputs.changed == 'true'
        run: |
          cd temp-docs
          zip -r ${{ github.workspace }}/LlamaBlocks-Documentation-${{ steps.docs-date.outputs.date }}.zip . --exclude='.git/*'
      - name: Create docs repo release
        if: steps.check-for-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          gh release create ${{ steps.docs-date.outputs.date }} \
            ${{ github.workspace }}/LlamaBlocks-Documentation-${{ steps.docs-date.outputs.date }}.zip \
            --repo Omegabird113/LlamaBlocks-Documentation \
            --title "Documentation update ${{ steps.docs-date.outputs.date }}" \
            --notes "This is an automated documentation release due to LlamaBlocks sync workflow."
