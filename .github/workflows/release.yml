name: Release

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: "Release title (e.g. LlamaBlocks 1.3.2 Beta 2 (1.21.1))"
        required: true
        type: string
      version_tag:
        description: "Technical version (e.g. 1.3.2-beta2+mc1.21.1)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
      game_version:
        description: "Minecraft version (e.g. 1.21.8)"
        required: true
        type: string
      changelog:
        description: "Changelog entries (comma-separated)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate built JAR
        id: jar
        run: |
          JARS=$(find build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-all.jar")
          COUNT=$(echo "$JARS" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 JAR, found $COUNT"
            echo "$JARS"
            exit 1
          fi
          echo "path=$JARS" >> "$GITHUB_OUTPUT"

      - name: Format changelog
        run: |
          echo "${{ inputs.changelog }}" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed 's/^/- /' > changelog_body.md

      - name: Zip documentation
        run: |
          zip -r LlamaBlocks-Documentation.zip documentation/

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.version_tag }}" >/dev/null 2>&1; then
            echo "ERROR: Release ${{ inputs.version_tag }} already exists"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" != "release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ inputs.version_tag }}" \
            "${{ steps.jar.outputs.path }}" \
            "LlamaBlocks-Documentation.zip" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.release_title }}" \
            --notes-file changelog_body.md \
            $PRERELEASE_FLAG

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: XITt2S5x
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1435491
          curseforge-token: ${{ secrets.CF_API_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: ${{ inputs.release_title }}
          version: ${{ inputs.version_tag }}
          version-type: ${{ inputs.release_type }}
          changelog-file: changelog_body.md
          game-versions: ${{ inputs.game_version }}
          loaders: neoforge
          dependencies: |
            neoforge(required)
