name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'documentation/**'
      - 'mkdocs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zensical
        uses: zensical/setup-zensical@v1
        with:
          version: 'latest'

      - name: Build with Zensical
        run: zensical build --config mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
